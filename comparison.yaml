apiVersion: apps/v1
kind: Deployment
metadata:
  name: notas-api-v1
  namespace: notas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notas-api-preview
      version: v1
  template:
    metadata:
      labels:
        app: notas-api-preview
        version: v1
    spec:
      containers:
        - name: notas-api
          image: notas-api:v3
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v2"
            - name: BACKGROUND_COLOR
              value: "#bbf7d0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
---
